<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AmbisonicsPlayer (Azimuth)</title>
  <style>
    /* ===== CSS Custom Properties ===== */
    :root {
      --color-bg: #0d0d1a;
      --color-bg-panel: #141428;
      --color-bg-input: #1a1a35;
      --color-bg-hover: #1e1e3a;
      --color-text: #e0e0f0;
      --color-text-muted: #8888aa;
      --color-track-a: #00d4ff;
      --color-track-a-dim: rgba(0, 212, 255, 0.15);
      --color-track-b: #ff6b9d;
      --color-track-b-dim: rgba(255, 107, 157, 0.15);
      --color-accent: #7c5cff;
      --color-border: #2a2a4a;
      --color-error: #ff4466;
      --color-error-bg: rgba(255, 68, 102, 0.1);
      --color-success: #44ff88;
      --color-slider-track: #2a2a4a;
      --color-slider-thumb: #e0e0f0;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --transition-fast: 0.15s ease;
      --transition-normal: 0.25s ease;
    }

    /* ===== Reset & Base ===== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ===== Accessibility: Visually Hidden ===== */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ===== Header ===== */
    header {
      text-align: center;
      padding: 20px 16px 12px;
      background: linear-gradient(180deg, rgba(124, 92, 255, 0.08) 0%, transparent 100%);
      border-bottom: 1px solid var(--color-border);
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, var(--color-track-a), var(--color-accent), var(--color-track-b));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .readme-link {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 12px;
      font-size: 0.75rem;
      color: var(--color-text-muted);
      text-decoration: none;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      transition: color var(--transition-fast), border-color var(--transition-fast);
    }

    .readme-link:hover {
      color: var(--color-text);
      border-color: var(--color-text-muted);
    }

    /* ===== App Container: 2-Column Grid (single track + center) ===== */
    .app-container {
      display: grid;
      grid-template-columns: minmax(280px, 1.2fr) minmax(0, 1fr);
      gap: 16px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px;
      min-height: calc(100vh - 80px);
      align-items: start;
    }

    /* センターパネル非表示時は1カラムに */
    .app-container:has(> .center-panel[hidden]) {
      grid-template-columns: 1fr;
      max-width: 600px;
    }

    /* ===== Track Panels ===== */
    .track-panel {
      background: var(--color-bg-panel);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: hidden;
      min-width: 0;
    }

    #track-a {
      border-top: 3px solid var(--color-track-a);
    }

    .track-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    #track-a .track-title {
      color: var(--color-track-a);
    }

    /* ===== URL Input & Load Button ===== */
    .track-url-controls {
      display: flex;
      gap: 8px;
    }

    .url-input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      background: var(--color-bg-input);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      color: var(--color-text);
      font-size: 0.85rem;
      outline: none;
      transition: border-color var(--transition-fast);
      min-height: 44px;
    }

    .url-input::placeholder {
      color: var(--color-text-muted);
    }

    .url-input:focus {
      border-color: var(--color-accent);
    }

    #track-a .url-input:focus {
      border-color: var(--color-track-a);
    }

    .load-btn {
      padding: 10px 16px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-bg-input);
      color: var(--color-text);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition-fast), border-color var(--transition-fast);
      white-space: nowrap;
      min-height: 44px;
      min-width: 44px;
    }

    .load-btn:hover {
      background: var(--color-bg-hover);
    }

    #track-a .load-btn:hover {
      border-color: var(--color-track-a);
      color: var(--color-track-a);
    }

    .load-btn:active {
      transform: scale(0.97);
    }

    /* ===== Source Status ===== */
    .track-source-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: var(--color-bg-input);
      border-radius: var(--radius-sm);
      min-height: 32px;
      overflow: hidden;
      min-width: 0;
    }

    .source-status-text {
      font-size: 0.78rem;
      color: var(--color-text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .source-status-text.loaded-local {
      color: var(--color-accent);
    }

    .source-status-text.loaded-network {
      color: var(--color-success);
    }

    .source-clear-btn {
      padding: 2px 8px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--color-text-muted);
      font-size: 0.75rem;
      cursor: pointer;
      transition: color var(--transition-fast), border-color var(--transition-fast);
      min-width: 28px;
      min-height: 28px;
      margin-left: 8px;
      flex-shrink: 0;
    }

    .source-clear-btn:hover {
      color: var(--color-error);
      border-color: var(--color-error);
    }

    .source-clear-btn[hidden] {
      display: none;
    }

    /* ===== Load Section Labels ===== */
    .track-load-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .load-section-label {
      font-size: 0.7rem;
      color: var(--color-text-muted);
      letter-spacing: 0.04em;
    }

    /* ===== File Select Button ===== */
    .track-file-controls {
      display: flex;
    }

    .file-select-btn {
      width: 100%;
      padding: 8px 12px;
      border: 1px dashed var(--color-border);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--color-text-muted);
      font-size: 0.82rem;
      cursor: pointer;
      transition: background var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast);
      min-height: 40px;
    }

    .file-select-btn:hover {
      background: var(--color-bg-hover);
      border-color: var(--color-accent);
      color: var(--color-text);
    }

    .file-input-hidden {
      display: none;
    }

    /* Drop zone highlight on track panel */
    .track-panel.drop-active {
      border-color: var(--color-accent) !important;
      box-shadow: inset 0 0 20px rgba(124, 92, 255, 0.1);
    }

    /* ===== Loading Indicator ===== */
    .loading-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(124, 92, 255, 0.08);
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      color: var(--color-text-muted);
    }

    .loading-indicator[hidden] {
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid var(--color-border);
      border-top-color: var(--color-accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    #track-a .spinner {
      border-top-color: var(--color-track-a);
    }

    /* ===== Error Display ===== */
    .error-display {
      padding: 10px 14px;
      background: var(--color-error-bg);
      border: 1px solid rgba(255, 68, 102, 0.3);
      border-radius: var(--radius-sm);
      color: var(--color-error);
      font-size: 0.82rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .error-display[hidden] {
      display: none;
    }

    /* ===== Track Warning ===== */
    .track-warning {
      padding: 8px 12px;
      background: rgba(255, 180, 0, 0.1);
      border: 1px solid rgba(255, 180, 0, 0.3);
      border-radius: var(--radius-sm);
      color: #ffb400;
      font-size: 0.78rem;
      line-height: 1.4;
    }

    .track-warning[hidden] {
      display: none;
    }

    .waveform-canvas.disabled {
      pointer-events: none;
      opacity: 0.4;
    }

    /* ===== Format Info Display (Task 18.1) ===== */
    .format-info {
      padding: 6px 10px;
      background: rgba(124, 92, 255, 0.08);
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      color: var(--color-accent);
      text-align: center;
    }
    .format-info[hidden] { display: none; }

    /* ===== App Footer (Task 18.4) ===== */
    .app-footer {
      text-align: center;
      padding: 12px 16px;
      font-size: 0.7rem;
      color: var(--color-text-muted);
    }

    /* ===== Track Info ===== */
    .track-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: var(--color-text-muted);
      min-height: 20px;
    }

    .track-name {
      word-break: break-all;
    }

    .track-duration {
      font-variant-numeric: tabular-nums;
    }

    /* ===== Waveform Canvas ===== */
    .waveform-canvas {
      width: 100%;
      height: 80px;
      background: var(--color-bg-input);
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: block;
    }

    /* ===== Volume Control (Vertical Slider) ===== */
    .volume-control {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      padding-top: 4px;
    }

    .volume-control label {
      font-size: 0.75rem;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      flex-shrink: 0;
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: transparent;
      cursor: pointer;
      min-height: 44px;
      padding: 16px 0;
    }

    /* Volume slider track */
    .volume-slider::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      background: var(--color-slider-track);
      border-radius: 3px;
    }

    .volume-slider::-moz-range-track {
      width: 100%;
      height: 6px;
      background: var(--color-slider-track);
      border-radius: 3px;
      border: none;
    }

    /* Volume slider thumb */
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      background: var(--color-slider-thumb);
      border-radius: 50%;
      border: none;
      cursor: pointer;
      margin-top: -7px;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.4);
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
    }

    .volume-slider::-moz-range-thumb {
      width: 20px;
      height: 20px;
      background: var(--color-slider-thumb);
      border-radius: 50%;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.4);
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
    }

    #track-a .volume-slider::-webkit-slider-thumb:hover {
      box-shadow: 0 0 12px var(--color-track-a);
      transform: scale(1.15);
    }

    #track-a .volume-slider::-moz-range-thumb:hover {
      box-shadow: 0 0 12px var(--color-track-a);
      transform: scale(1.15);
    }

    /* ===== Center Panel ===== */
    .center-panel {
      background: var(--color-bg-panel);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .center-panel[hidden] {
      display: none;
    }

    /* ===== Transport Controls ===== */
    .transport-controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: nowrap;
    }

    .transport-btn {
      padding: 12px 24px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-bg-input);
      color: var(--color-text);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition-fast), border-color var(--transition-fast),
                  transform var(--transition-fast), box-shadow var(--transition-fast);
      min-height: 48px;
      min-width: 48px;
      user-select: none;
    }

    .transport-btn:hover:not(:disabled) {
      background: var(--color-bg-hover);
      border-color: var(--color-accent);
    }

    .transport-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .transport-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Play button specific */
    #play-btn:not(:disabled):hover {
      border-color: var(--color-success);
      box-shadow: 0 0 12px rgba(68, 255, 136, 0.15);
    }

    /* Loop button active state */
    #loop-btn[aria-pressed="true"] {
      background: rgba(124, 92, 255, 0.2);
      border-color: var(--color-accent);
      color: var(--color-accent);
      box-shadow: 0 0 10px rgba(124, 92, 255, 0.2);
    }

    /* ===== Rotation UI (Canvas 2D Sphere Gizmo) ===== */
    .rotation-ui-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .rotation-canvas {
      display: block;
      border-radius: 50%;
      cursor: grab;
      touch-action: none; /* Prevent browser scroll on touch drag */
      /* サイズは JS (_resizeCanvas) で style.width/height を明示設定する */
    }

    .rotation-canvas:active {
      cursor: grabbing;
    }

    /* ===== Decode Mode Selector ===== */
    .decode-mode-selector {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: nowrap;
    }
    .mode-btn {
      padding: 8px 16px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-bg-input);
      color: var(--color-text-muted);
      font-size: 0.82rem;
      cursor: pointer;
      transition: background var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast);
      min-height: 44px;
    }
    .mode-btn:hover:not(:disabled) {
      background: var(--color-bg-hover);
      border-color: var(--color-accent);
    }
    .mode-btn-active {
      background: rgba(124, 92, 255, 0.2);
      border-color: var(--color-accent);
      color: var(--color-accent);
    }
    .mode-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* ===== Progress Bar ===== */
    .progress-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-bar {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      background: transparent;
      cursor: pointer;
      min-height: 44px;
      padding: 18px 0;
    }

    .progress-bar::-webkit-slider-runnable-track {
      width: 100%;
      height: 8px;
      background: var(--color-slider-track);
      border-radius: 4px;
    }

    .progress-bar::-moz-range-track {
      width: 100%;
      height: 8px;
      background: var(--color-slider-track);
      border-radius: 4px;
      border: none;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: var(--color-accent);
      border-radius: 50%;
      border: none;
      margin-top: -4px;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(124, 92, 255, 0.4);
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
    }

    .progress-bar::-moz-range-thumb {
      width: 16px;
      height: 16px;
      background: var(--color-accent);
      border-radius: 50%;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(124, 92, 255, 0.4);
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
    }

    .progress-bar::-webkit-slider-thumb:hover {
      transform: scale(1.3);
      box-shadow: 0 0 14px rgba(124, 92, 255, 0.6);
    }

    .progress-bar::-moz-range-thumb:hover {
      transform: scale(1.3);
      box-shadow: 0 0 14px rgba(124, 92, 255, 0.6);
    }

    /* Disabled (unloaded) state for the seek/progress bar (要件 10.8) */
    .progress-bar:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .time-display {
      display: flex;
      justify-content: center;
      gap: 4px;
      font-size: 0.82rem;
      color: var(--color-text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* ===== Share Button ===== */
    .share-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .share-btn {
      padding: 10px 20px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-bg-input);
      color: var(--color-text-muted);
      font-size: 0.82rem;
      cursor: pointer;
      transition: background var(--transition-fast), color var(--transition-fast),
                  border-color var(--transition-fast);
      min-height: 44px;
    }

    .share-btn:hover {
      background: var(--color-bg-hover);
      color: var(--color-text);
      border-color: var(--color-accent);
    }

    .share-btn:active {
      transform: scale(0.97);
    }

    .share-description {
      margin: 6px 0 0;
      font-size: 0.72rem;
      color: var(--color-text-muted);
      text-align: center;
      line-height: 1.4;
    }

    /* ===== Keyboard Shortcuts Help ===== */
    .shortcuts-help {
      max-width: 1400px;
      margin: 0 auto;
      padding: 12px 16px 24px;
      text-align: center;
    }

    .shortcuts-toggle {
      padding: 8px 16px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--color-text-muted);
      font-size: 0.78rem;
      cursor: pointer;
      transition: color var(--transition-fast), border-color var(--transition-fast);
      min-height: 44px;
    }

    .shortcuts-toggle:hover {
      color: var(--color-text);
      border-color: var(--color-text-muted);
    }

    .shortcuts-list {
      margin: 12px auto 0;
      padding: 16px;
      background: var(--color-bg-panel);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      display: inline-flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
    }

    .shortcuts-list[hidden] {
      display: none;
    }

    .shortcut-item {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .shortcut-item dt {
      min-width: 60px;
    }

    .shortcut-item dd {
      margin: 0;
      font-size: 0.82rem;
      color: var(--color-text-muted);
    }

    kbd {
      display: inline-block;
      padding: 3px 8px;
      background: var(--color-bg-input);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.78rem;
      color: var(--color-text);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    /* ===== Mobile Responsive (≤768px) ===== */
    @media (max-width: 768px) {
      .app-container {
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 12px;
      }

      /* Reorder: Center, Track */
      .center-panel { order: 1; }
      #track-a { order: 2; }

      header h1 {
        font-size: 1.25rem;
      }

      .track-panel {
        padding: 16px;
      }

      .center-panel {
        padding: 20px 16px;
        gap: 20px;
      }

      .waveform-canvas {
        height: 60px;
      }

      .transport-btn {
        padding: 12px 20px;
        font-size: 0.85rem;
      }

      .shortcuts-help {
        padding: 8px 12px 20px;
      }
    }

    /* ===== Small Mobile (≤480px) ===== */
    @media (max-width: 480px) {
      .track-url-controls {
        flex-direction: column;
      }

      .load-btn {
        width: 100%;
      }
    }

    /* ===== Focus Styles for Accessibility ===== */
    :focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }

    input[type="range"]:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 4px;
    }

    /* ===== Reduced Motion ===== */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>AmbisonicsPlayer (Azimuth)</h1>
    <a id="readme-link" class="readme-link" href="https://github.com/" target="_blank" rel="noopener noreferrer" aria-label="使い方・ドキュメントを開く">📖 使い方</a>
  </header>

  <main class="app-container">
    <!-- Track (Left Panel) -->
    <section id="track-a" class="track-panel" aria-label="トラック">
      <h2 class="track-title">トラック</h2>

      <div class="track-source-status" id="source-status-a">
        <span class="source-status-text">音源が読み込まれていません</span>
        <button class="source-clear-btn" id="clear-a" hidden aria-label="音源をクリア">✕</button>
      </div>
      <div id="format-info" class="format-info" hidden>
        <span id="format-info-text"></span>
      </div>
      <div class="track-load-section">
        <span class="load-section-label">🌐 ネットワーク</span>
        <div class="track-url-controls">
          <label for="url-a" class="visually-hidden">音源URL</label>
          <input
            type="text"
            id="url-a"
            class="url-input"
            placeholder="音源URLを入力..."
            aria-label="音源のURL入力"
          />
          <button id="load-a" class="load-btn" aria-label="URLから読み込む">読込</button>
        </div>
      </div>
      <div class="track-load-section">
        <span class="load-section-label">📁 ローカル</span>
        <div class="track-file-controls">
          <button id="file-a" class="file-select-btn" aria-label="ローカルファイルを選択またはドロップ">ファイルを選択 / ドロップ</button>
          <input type="file" id="file-input-a" class="file-input-hidden" accept="audio/*,.wav,.mp3,.flac,.ogg" />
        </div>
      </div>

      <div id="loading-a" class="loading-indicator" hidden aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <span>読み込み中...</span>
      </div>

      <div id="error-a" class="error-display" hidden role="alert" aria-live="assertive"></div>

      <div id="info-a" class="track-info" aria-label="音源情報">
        <span class="track-name"></span>
        <span class="track-duration"></span>
      </div>

      <div id="warning-a" class="track-warning" hidden>⚠ 互換モードで動作中: 波形表示とAmbisonics回転処理は利用できません</div>

      <canvas id="waveform-a" class="waveform-canvas" width="300" height="100" aria-label="波形表示"></canvas>

      <div class="volume-control">
        <label for="volume-a">音量</label>
        <input
          type="range"
          id="volume-a"
          class="volume-slider"
          min="0"
          max="1"
          step="0.01"
          value="1"
          aria-label="音量"
          aria-valuemin="0"
          aria-valuemax="1"
          aria-valuenow="1"
        />
      </div>
    </section>

    <!-- Center Panel (初期状態では非表示。音源読み込み+AudioWorklet初期化成功で表示) -->
    <section class="center-panel" id="center-panel" aria-label="再生コントロール" hidden>
      <!-- Rotation UI (Canvas 2D Sphere Gizmo) -->
      <div class="rotation-ui-container" id="rotation-ui-container">
        <canvas id="rotation-canvas" class="rotation-canvas" width="300" height="300" aria-label="回転操作"></canvas>
      </div>

      <!-- Transport Controls -->
      <div class="transport-controls" role="group" aria-label="トランスポートコントロール">
        <button id="seek-start-btn" class="transport-btn" aria-label="先頭に戻る">
          ⏮ 先頭
        </button>
        <button id="play-btn" class="transport-btn" disabled aria-label="再生/停止">
          ▶ 再生
        </button>
        <button id="loop-btn" class="transport-btn" aria-label="ループ再生の切り替え" aria-pressed="false">
          🔁 ループ
        </button>
      </div>

      <!-- Rotation Reset Button (standalone) -->
      <button id="rotation-reset-btn" class="transport-btn" aria-label="回転をリセット">
        ↺ 回転リセット
      </button>

      <!-- Decode Mode Selector -->
      <div class="decode-mode-selector" role="radiogroup" aria-label="デコードモード">
        <button id="mode-stereo" class="mode-btn" role="radio" aria-checked="false">ステレオ</button>
        <button id="mode-binaural" class="mode-btn mode-btn-active" role="radio" aria-checked="true">バイノーラル</button>
      </div>

      <!-- Progress Bar -->
      <div class="progress-container" role="group" aria-label="再生進捗">
        <input
          type="range"
          id="progress-bar"
          class="progress-bar"
          min="0"
          max="100"
          step="0.1"
          value="0"
          aria-label="再生位置"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        />
        <div id="time-display" class="time-display" aria-live="off">
          <span class="current-time">0:00</span>
          <span class="time-separator">/</span>
          <span class="total-time">0:00</span>
        </div>
      </div>

      <!-- Share Button -->
      <div class="share-container">
        <button id="share-btn" class="share-btn" aria-label="現在の音源設定を含む共有用URLをクリップボードにコピー" title="現在読み込んでいる音源の組み合わせを、他の人にも同じ状態で開けるURLとしてコピーします">
          🔗 共有用URLをコピー
        </button>
        <p class="share-description">現在の音源込みで共有できるURLをクリップボードにコピーします</p>
      </div>
    </section>
  </main>

  <!-- Keyboard Shortcuts Help -->
  <aside id="shortcuts-help" class="shortcuts-help" aria-label="キーボードショートカット">
    <button class="shortcuts-toggle" aria-expanded="false" aria-controls="shortcuts-list">
      ⌨ キーボードショートカット
    </button>
    <dl id="shortcuts-list" class="shortcuts-list" hidden>
      <div class="shortcut-item">
        <dt><kbd>Space</kbd></dt>
        <dd>再生 / 停止</dd>
      </div>
    </dl>
  </aside>

  <footer class="app-footer">
    <p>MIT License &copy; 2026 Kagoiri</p>
  </footer>

  <script>
    // ============================================================
    // AmbiMath — 純粋ロジック名前空間
    // ============================================================
    // Canonical source: src/ambi-math.mjs — keep in sync
    // テスト可能な副作用のない純粋関数をここに集約する。
    window.AmbiMath = Object.create(null);

    // --- Task 2.1: 角度正規化関数 ---
    window.AmbiMath.normalizeAngle360 = function normalizeAngle360(deg) {
      if (!isFinite(deg)) return 0;
      const result = deg % 360;
      return result < 0 ? result + 360 : result;
    };

    window.AmbiMath.normalizePitch = function normalizePitch(deg) {
      if (!isFinite(deg)) return 0;
      return Math.max(-90, Math.min(90, deg));
    };

    // --- Task 2.4: 表示用角度丸め ---
    window.AmbiMath.roundAngleForDisplay = function roundAngleForDisplay(deg, axis) {
      if (axis === 'pitch') {
        return Math.round(window.AmbiMath.normalizePitch(deg));
      }
      return Math.round(window.AmbiMath.normalizeAngle360(deg)) % 360;
    };

    // --- Task 2.6: ジェスチャー分類と軸別デルタ適用 ---
    window.AmbiMath.classifyGesture = function classifyGesture(dx, dy, threshold = 5) {
      if (Math.hypot(dx, dy) < threshold) {
        return 'none';
      }
      const absDx = Math.abs(dx);
      const absDy = Math.abs(dy);
      if (absDx > absDy) return 'horizontal';
      if (absDy > absDx) return 'vertical';
      return 'horizontal';
    };

    window.AmbiMath.applyYawDelta = function applyYawDelta(currentYaw, dxPixels, sensitivity = 0.5) {
      return window.AmbiMath.normalizeAngle360(currentYaw + dxPixels * sensitivity);
    };

    window.AmbiMath.applyPitchDelta = function applyPitchDelta(currentPitch, dyPixels, sensitivity = 0.5) {
      return window.AmbiMath.normalizePitch(currentPitch + dyPixels * sensitivity);
    };

    // --- Task 2.9: クランプ・整形関数 ---
    window.AmbiMath.clampVolume = function clampVolume(v) {
      if (!isFinite(v)) return 0;
      return Math.max(0, Math.min(1, v));
    };

    window.AmbiMath.clampSeek = function clampSeek(position, duration) {
      if (!isFinite(position)) position = 0;
      if (!isFinite(duration) || duration < 0) duration = 0;
      return Math.max(0, Math.min(duration, position));
    };

    window.AmbiMath.formatTime = function formatTime(seconds) {
      if (!isFinite(seconds) || seconds < 0) seconds = 0;
      const totalSec = Math.floor(seconds);
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return m + ':' + String(s).padStart(2, '0');
    };

    window.AmbiMath.calculatePositionFromClick = function calculatePositionFromClick(canvasWidth, canvasOffsetLeft, clientX) {
      if (!isFinite(canvasWidth) || canvasWidth <= 0) return 0;
      if (!isFinite(canvasOffsetLeft)) canvasOffsetLeft = 0;
      if (!isFinite(clientX)) return 0;
      const position = (clientX - canvasOffsetLeft) / canvasWidth;
      return Math.max(0, Math.min(1, position));
    };

    // --- Task 3.1: 座標回転行列 R3 の生成と恒等判定 ---
    window.AmbiMath.buildR3 = function buildR3(yawDeg, pitchDeg, rollDeg) {
      const DEG2RAD = Math.PI / 180;
      const a = yawDeg * DEG2RAD;
      const b = pitchDeg * DEG2RAD;
      const c = rollDeg * DEG2RAD;
      const ca = Math.cos(a), sa = Math.sin(a);
      const cb = Math.cos(b), sb = Math.sin(b);
      const cc = Math.cos(c), sc = Math.sin(c);
      const out = new Float64Array(9);
      out[0] = ca * cb;
      out[1] = ca * sb * sc - sa * cc;
      out[2] = ca * sb * cc + sa * sc;
      out[3] = sa * cb;
      out[4] = sa * sb * sc + ca * cc;
      out[5] = sa * sb * cc - ca * sc;
      out[6] = -sb;
      out[7] = cb * sc;
      out[8] = cb * cc;
      return out;
    };

    window.AmbiMath.isIdentityRotation = function isIdentityRotation(yawDeg, pitchDeg, rollDeg, tolerance = 1e-10) {
      let yaw = yawDeg % 360;
      if (yaw < 0) yaw += 360;
      const yawZero = yaw <= tolerance || yaw >= 360 - tolerance;
      let roll = rollDeg % 360;
      if (roll < 0) roll += 360;
      const rollZero = roll <= tolerance || roll >= 360 - tolerance;
      const pitchZero = Math.abs(pitchDeg) <= tolerance;
      return yawZero && pitchZero && rollZero;
    };

    // --- Task 3.2: 球面調和回転行列 buildRotationMatrix ---
    window.AmbiMath.buildRotationMatrix = function buildRotationMatrix(order, yawDeg, pitchDeg, rollDeg) {
      const N = (order + 1) * (order + 1);
      if (window.AmbiMath.isIdentityRotation(yawDeg, pitchDeg, rollDeg)) {
        const M = new Float64Array(N * N);
        for (let i = 0; i < N; i++) M[i * N + i] = 1;
        return M;
      }
      const R3 = window.AmbiMath.buildR3(yawDeg, pitchDeg, rollDeg);
      // M_1 with Condon-Shortley phase (Ivanic & Ruedenberg Appendix 1)
      const R1 = new Float64Array(9);
      R1[0] = R3[4];   R1[1] = -R3[5];  R1[2] = R3[3];
      R1[3] = -R3[7];  R1[4] = R3[8];   R1[5] = -R3[6];
      R1[6] = R3[1];   R1[7] = -R3[2];  R1[8] = R3[0];

      function getCE(mat, size, i, j) {
        const off = (size - 1) / 2;
        return mat[(i + off) * size + (j + off)];
      }
      function P(i, a, b, l, degs) {
        const prevSize = 2*(l-1)+1;
        if (b === l) {
          return getCE(degs[1],3,i,1)*getCE(degs[l-1],prevSize,a,l-1) -
                 getCE(degs[1],3,i,-1)*getCE(degs[l-1],prevSize,a,-l+1);
        } else if (b === -l) {
          return getCE(degs[1],3,i,1)*getCE(degs[l-1],prevSize,a,-l+1) +
                 getCE(degs[1],3,i,-1)*getCE(degs[l-1],prevSize,a,l-1);
        } else {
          return getCE(degs[1],3,i,0)*getCE(degs[l-1],prevSize,a,b);
        }
      }
      function U(m,n,l,degs) { return P(0,m,n,l,degs); }
      function V(m,n,l,degs) {
        if (m===0) return P(1,1,n,l,degs)+P(-1,-1,n,l,degs);
        if (m>0) {
          const d=(m===1)?1:0;
          return P(1,m-1,n,l,degs)*Math.sqrt(1+d) - P(-1,-m+1,n,l,degs)*(1-d);
        }
        const d=(m===-1)?1:0;
        return P(1,m+1,n,l,degs)*(1-d) + P(-1,-m-1,n,l,degs)*Math.sqrt(1+d);
      }
      function W(m,n,l,degs) {
        if (m===0) return 0;
        if (m>0) return P(1,m+1,n,l,degs)+P(-1,-m-1,n,l,degs);
        return P(1,m-1,n,l,degs)-P(-1,-m+1,n,l,degs);
      }
      function uvw(m,n,l) {
        const d=(m===0)?1:0, absM=Math.abs(m), absN=Math.abs(n);
        const denom=(absN===l)?(2*l)*(2*l-1):(l+n)*(l-n);
        const u=Math.sqrt((l+m)*(l-m)/denom);
        const v=0.5*Math.sqrt((1+d)*(l+absM-1)*(l+absM)/denom)*(1-2*d);
        const w=-0.5*Math.sqrt((l-absM-1)*(l-absM)/denom)*(1-d);
        return [u,v,w];
      }
      const degrees = [];
      degrees[0] = new Float64Array([1]);
      degrees[1] = R1;
      for (let l = 2; l <= order; l++) {
        const size = 2*l+1;
        const Rl = new Float64Array(size*size);
        for (let m=-l; m<=l; m++) {
          for (let n=-l; n<=l; n++) {
            let [u,v,w] = uvw(m,n,l);
            if (Math.abs(u)>1e-15) u*=U(m,n,l,degrees); else u=0;
            if (Math.abs(v)>1e-15) v*=V(m,n,l,degrees); else v=0;
            if (Math.abs(w)>1e-15) w*=W(m,n,l,degrees); else w=0;
            Rl[(m+l)*size+(n+l)] = u+v+w;
          }
        }
        degrees[l] = Rl;
      }
      const M = new Float64Array(N * N);
      let offset = 0;
      for (let l = 0; l <= order; l++) {
        const size = 2*l+1;
        const Rl = degrees[l];
        for (let i = 0; i < size; i++) {
          for (let j = 0; j < size; j++) {
            M[(offset+i)*N + (offset+j)] = Rl[i*size + j];
          }
        }
        offset += size;
      }
      return M;
    };

    // --- Task 3.6: ステレオデコード行列 ---
    window.AmbiMath.buildStereoDecodeMatrix = function buildStereoDecodeMatrix(order) {
      const N = (order + 1) * (order + 1);
      const D = new Float64Array(2 * N);
      D[0] = 0.5; D[N] = 0.5;
      D[1] = 0.5; D[N + 1] = -0.5;
      if (order >= 2) { D[8] = 0.25; D[N + 8] = -0.25; }
      if (order >= 3) { D[15] = 0.125; D[N + 15] = -0.125; }
      return D;
    };

    // --- Task 7.1: FormatDetector ---
    window.AmbiMath.channelsToOrder = function channelsToOrder(n) {
      if (n === 4) return 1;
      if (n === 9) return 2;
      if (n === 16) return 3;
      return null;
    };

    window.AmbiMath.isValidAmbisonicsChannelCount = function isValidAmbisonicsChannelCount(n) {
      return n === 4 || n === 9 || n === 16;
    };

    window.AmbiMath.detectFormat = function detectFormat(numberOfChannels, metadataHint) {
      const order = window.AmbiMath.channelsToOrder(numberOfChannels);
      if (order === null) return null;
      let format = 'ambix';
      if (typeof metadataHint === 'string') {
        const hint = metadataHint.toLowerCase();
        if (hint.includes('fuma') || hint.endsWith('.amb')) {
          format = 'fuma';
        }
      }
      return { format, order, channelCount: numberOfChannels };
    };

    // --- Task 7.3: フォーマット表示文字列 ---
    window.AmbiMath.formatInfoToDisplay = function formatInfoToDisplay(info) {
      if (info == null) return '';
      const formatName = info.format === 'fuma' ? 'FuMa' : 'AmbiX';
      const orderStr = info.order + '次';
      return formatName + ' ' + orderStr + ' (' + info.channelCount + 'ch)';
    };

    // --- Task 7.5: pickFirstFile / convertDropboxUrl ---
    window.AmbiMath.pickFirstFile = function pickFirstFile(files) {
      if (files && files.length > 0) return files[0];
      return null;
    };

    window.AmbiMath.convertDropboxUrl = function convertDropboxUrl(url) {
      const originalUrl = url;
      if (/^https?:\/\/(www\.)?dropbox\.com\//i.test(url)) {
        try {
          const urlObj = new URL(url);
          urlObj.hostname = 'dl.dropboxusercontent.com';
          urlObj.searchParams.delete('dl');
          const converted = urlObj.toString();
          return { converted, isConverted: converted !== url, originalUrl };
        } catch {
          return { converted: url, isConverted: false, originalUrl };
        }
      }
      return { converted: url, isConverted: false, originalUrl };
    };

    // --- Task 4.1: FormatConverter (AmbiX↔FuMa 変換) ---
    (function() {
      const FUMA2AMBIX_PERM = [
        0,
        2, 3, 1,
        8, 6, 4, 5, 7,
        15, 13, 11, 9, 10, 12, 14,
      ];

      const FUMA2SN3D_FACTORS = [
        Math.sqrt(2),
        Math.sqrt(3), Math.sqrt(3), Math.sqrt(3),
        Math.sqrt(5), Math.sqrt(5), 1, Math.sqrt(5), Math.sqrt(5),
        Math.sqrt(35 / 8), Math.sqrt(7), Math.sqrt(21 / 5), 1, Math.sqrt(21 / 5), Math.sqrt(7), Math.sqrt(35 / 8),
      ];

      window.AmbiMath.getPermutation = function getPermutation(order, direction) {
        const N = (order + 1) * (order + 1);
        const fwd = FUMA2AMBIX_PERM.slice(0, N);
        if (direction === 'fuma2ambix') return fwd;
        const inv = new Array(N);
        for (let acn = 0; acn < N; acn++) inv[fwd[acn]] = acn;
        return inv;
      };

      window.AmbiMath.getNormFactors = function getNormFactors(order, direction) {
        const N = (order + 1) * (order + 1);
        const fwd = FUMA2SN3D_FACTORS.slice(0, N);
        if (direction === 'fuma2ambix') return fwd;
        return fwd.map(c => 1 / c);
      };

      window.AmbiMath.fumaToAmbix = function fumaToAmbix(channels, order) {
        const N = (order + 1) * (order + 1);
        const perm = window.AmbiMath.getPermutation(order, 'fuma2ambix');
        const factors = window.AmbiMath.getNormFactors(order, 'fuma2ambix');
        const result = new Array(N);
        for (let acn = 0; acn < N; acn++) {
          const src = channels[perm[acn]];
          const len = src.length;
          const dst = new Float32Array(len);
          const f = factors[acn];
          for (let i = 0; i < len; i++) dst[i] = f * src[i];
          result[acn] = dst;
        }
        return result;
      };

      window.AmbiMath.ambixToFuma = function ambixToFuma(channels, order) {
        const N = (order + 1) * (order + 1);
        const perm = window.AmbiMath.getPermutation(order, 'ambix2fuma');
        const factors = window.AmbiMath.getNormFactors(order, 'ambix2fuma');
        const result = new Array(N);
        for (let fumaIdx = 0; fumaIdx < N; fumaIdx++) {
          const acn = perm[fumaIdx];
          const src = channels[acn];
          const len = src.length;
          const dst = new Float32Array(len);
          const f = factors[acn];
          for (let i = 0; i < len; i++) dst[i] = f * src[i];
          result[fumaIdx] = dst;
        }
        return result;
      };

      // --- Task 5.1: WAV エンコーダ encodeWavPCM ---
      function _writeString(view, offset, str) {
        for (let i = 0; i < str.length; i++) {
          view.setUint8(offset + i, str.charCodeAt(i));
        }
      }

      window.AmbiMath.encodeWavPCM = function encodeWavPCM(channels, sampleRate, bitDepth = 16) {
        const numChannels = channels.length;
        const numSamples = numChannels > 0 ? channels[0].length : 0;
        const bytesPerSample = bitDepth / 8;
        const blockAlign = numChannels * bytesPerSample;
        const dataSize = numSamples * blockAlign;
        const audioFormat = bitDepth === 32 ? 3 : 1;

        const buffer = new ArrayBuffer(44 + dataSize);
        const view = new DataView(buffer);

        // RIFF header
        _writeString(view, 0, 'RIFF');
        view.setUint32(4, 36 + dataSize, true);
        _writeString(view, 8, 'WAVE');

        // fmt sub-chunk
        _writeString(view, 12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, audioFormat, true);
        view.setUint16(22, numChannels, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * blockAlign, true);
        view.setUint16(32, blockAlign, true);
        view.setUint16(34, bitDepth, true);

        // data sub-chunk
        _writeString(view, 36, 'data');
        view.setUint32(40, dataSize, true);

        // Write interleaved samples
        let offset = 44;
        for (let i = 0; i < numSamples; i++) {
          for (let ch = 0; ch < numChannels; ch++) {
            const sample = channels[ch][i];
            if (bitDepth === 16) {
              const clamped = Math.max(-1, Math.min(1, sample));
              const int16 = Math.round(clamped * 32767);
              view.setInt16(offset, int16, true);
              offset += 2;
            } else {
              view.setFloat32(offset, sample, true);
              offset += 4;
            }
          }
        }

        return buffer;
      };
    })();

    // --- Task 6.1: 共有 URL スキーマ (generateShareUrl / parseShareUrl) ---
    (function() {
      const SHARE_DEFAULTS = {
        yaw: 0,
        mode: 'binaural',
        vol: 100,
        t: 0,
        loop: false,
      };

      window.AmbiMath.SHARE_DEFAULTS = SHARE_DEFAULTS;

      window.AmbiMath.generateShareUrl = function generateShareUrl(state, baseUrl) {
        const base = baseUrl !== undefined ? baseUrl : window.location.origin + window.location.pathname;
        const url = new URL(base);

        if (state.src) {
          url.searchParams.set('src', state.src);
        }

        const yaw = Math.round(window.AmbiMath.normalizeAngle360(state.yaw || 0)) % 360;
        if (yaw !== SHARE_DEFAULTS.yaw) {
          url.searchParams.set('yaw', String(yaw));
        }

        const mode = (state.mode === 'binaural') ? 'binaural' : 'stereo';
        if (mode !== SHARE_DEFAULTS.mode) {
          url.searchParams.set('mode', mode);
        }

    // ============================================================
    // RotationController（Azimuth版 — Yaw のみ）
    // Yaw のみを操作するシンプルな回転コントローラー。
    // Pitch/Roll は常に 0 で固定。
    // ============================================================
    const RotationController = {
      state: { yaw: 0, pitch: 0, roll: 0 },
      _listeners: [],
      _gesture: null,
      _sensitivity: 0.5, // degrees per pixel

      beginGesture(x, y) {
        this._gesture = { startX: x, startY: y, direction: null, lastX: x, lastY: y };
      },

      updateGesture(x, y) {
        if (!this._gesture) return;
        const g = this._gesture;
        const dx = x - g.startX;
        const dy = y - g.startY;

        if (!g.direction) {
          const dir = window.AmbiMath.classifyGesture(dx, dy, 5);
          if (dir === 'none') return;
          g.direction = dir;
          g.lastX = x;
          g.lastY = y;
          return;
        }

        // Only respond to horizontal gestures (Yaw only)
        if (g.direction !== 'horizontal') return;

        const deltaX = x - g.lastX;
        g.lastX = x;
        g.lastY = y;

        this.state.yaw = window.AmbiMath.normalizeAngle360(this.state.yaw + deltaX * this._sensitivity);
        this._notify();
      },

      endGesture() {
        this._gesture = null;
      },

      reset() {
        this.state.yaw = 0;
        this.state.pitch = 0;
        this.state.roll = 0;
        this._notify();
      },

      getState() {
        return { ...this.state };
      },

      // 外部から姿勢を設定する（URL パラメータ復元用）
      setState(yaw, pitch, roll) {
        this.state.yaw = window.AmbiMath.normalizeAngle360(yaw || 0);
        // pitch/roll are always 0 in azimuth mode
        this.state.pitch = 0;
        this.state.roll = 0;
        this._notify();
      },

      onChange(callback) {
        this._listeners.push(callback);
      },

      removeListener(callback) {
        this._listeners = this._listeners.filter(l => l !== callback);
      },

      _notify() {
        const state = this.getState();
        for (const listener of this._listeners) {
          listener(state);
        }
      },
    };

    // ============================================================
    // RotationGizmo — Canvas 2D 球体ギズモ（固定要素）
    // Task 14.1: 円形回転領域と固定要素の描画
    // 要件 5.1, 19.1
    // ============================================================
    const RotationGizmo = {
      canvas: null,
      ctx: null,
      // Camera parameters (tunable constants per design)
      // 球体を「後方やや斜め上」から見る視点。
      // Y軸（左右）が水平に見え、正面方向(+x)は奥に向かう。
      CAMERA_ELEVATION: 10, // degrees - looking down slightly
      CAMERA_AZIMUTH: 20,   // degrees - rotated to the right
      _cameraMatrix: null,  // 3x3 camera rotation matrix (computed once)
      _bgImageData: null,   // cached background (fixed elements)

      init(canvasId) {
        this.canvas = document.getElementById(canvasId);
        if (!this.canvas) return;
        this.ctx = this.canvas.getContext('2d');
        this._computeCameraMatrix();
        this._resizeCanvas();
        this.drawFixed();
        window.addEventListener('resize', () => {
          this._resizeCanvas();
          this._bgImageData = null; // invalidate cache on resize
          this.drawFixed();
          // Redraw axes with current rotation state after resize
          this.drawAxes(RotationController.getState());
        });
      },

      _resizeCanvas() {
        const container = this.canvas.parentElement;
        const size = Math.max(200, Math.min(container.clientWidth, 400));
        const dpr = window.devicePixelRatio || 1;
        this.canvas.width = size * dpr;
        this.canvas.height = size * dpr;
        this.canvas.style.width = size + 'px';
        this.canvas.style.height = size + 'px';
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      },

      _computeCameraMatrix() {
        // カメラは球体を「後方やや斜め上」から見下ろす。
        // 座標系: x=前方, y=左方, z=上方。
        // 「後方から見る」= カメラは -x 方向に位置し +x 方向を見る。
        // 「斜め上から」= elevation > 0 で上から見下ろす。
        //   → Z軸の円（xy平面）は上半分が奥（薄い）、下半分が手前（濃い）になる。
        //
        // カメラ座標: right(→screen X), up(→screen Y), forward(→depth, 正=奥)
        // 基本姿勢（真後ろから見る）: right=+y, up=+z, forward=+x
        // Azimuth: z軸まわりに回転（右にずらす）
        // Elevation: right軸まわりに回転（上から見下ろす）
        const DEG2RAD = Math.PI / 180;
        const az = this.CAMERA_AZIMUTH * DEG2RAD;
        const el = this.CAMERA_ELEVATION * DEG2RAD;

        const caz = Math.cos(az), saz = Math.sin(az);
        const cel = Math.cos(el), sel = Math.sin(el);

        // After azimuth Rz(az) applied to world coords:
        //   right = sin(az)*x + cos(az)*y
        //   forward_pre = cos(az)*x - sin(az)*y
        //   up_pre = z
        // After elevation (tilt: look down = rotate around right axis by -el):
        //   forward = cos(el)*forward_pre - sin(el)*up_pre
        //   up = sin(el)*forward_pre + cos(el)*up_pre
        //
        // Matrix rows: [right, forward, up]
        this._cameraMatrix = new Float64Array([
          saz,       caz,       0,         // right
          cel*caz,   -cel*saz,  -sel,      // forward (positive = away from camera)
          sel*caz,   -sel*saz,  cel,       // up
        ]);
      },

      // Project a 3D point (x,y,z) to 2D canvas coordinates using the camera
      _project(x, y, z) {
        const C = this._cameraMatrix;
        // Camera matrix rows: 0=right, 1=forward(depth), 2=up
        const right   = C[0]*x + C[1]*y + C[2]*z;
        const forward = C[3]*x + C[4]*y + C[5]*z;
        const up      = C[6]*x + C[7]*y + C[8]*z;

        // Parallel projection: screen X = right, screen Y = -up (canvas Y is down)
        // Depth convention for front/back alpha:
        //   forward > 0 means the point is away from camera (behind the sphere center from viewer's perspective)
        //   forward < 0 means the point is towards camera (in front, visible)
        //   We want depth > 0 = "front" (towards viewer) for alpha purposes
        const canvasSize = this.canvas.width / (window.devicePixelRatio || 1);
        const centerX = canvasSize / 2;
        const centerY = canvasSize / 2;
        const radius = canvasSize * 0.4;

        return {
          sx: centerX + right * radius,
          sy: centerY - up * radius,
          depth: -forward, // negative forward = towards camera = front (high alpha)
        };
      },

      drawFixed() {
        const ctx = this.ctx;
        const canvasSize = this.canvas.width / (window.devicePixelRatio || 1);
        const centerX = canvasSize / 2;
        const centerY = canvasSize / 2;
        const radius = canvasSize * 0.4;

        // Clear
        ctx.clearRect(0, 0, canvasSize, canvasSize);

        // Draw translucent sphere (filled circle)
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(124, 92, 255, 0.06)'; // accent low alpha
        ctx.fill();

        // Draw sphere outline
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(200, 200, 220, 0.3)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Draw fixed white front arrow (listener's forward direction)
        // 矢印は正面方向(+x)を指す。起点と終点は球面上（半径1）。
        // カメラは後方から見ているので、+x は奥方向に向かう。
        // 起点: 球面上の -x 方向（手前側）
        // 終点: 球面上の +x 方向（奥側）
        const arrowStart = this._project(-1, 0, 0); // sphere surface, towards camera
        const arrowEnd = this._project(1, 0, 0);    // sphere surface, away from camera
        const arrowMid = this._project(0.75, 0, 0); // arrowhead base (inside sphere)

        // Arrow shaft
        ctx.beginPath();
        ctx.moveTo(arrowStart.sx, arrowStart.sy);
        ctx.lineTo(arrowEnd.sx, arrowEnd.sy);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Arrowhead
        const dx = arrowEnd.sx - arrowMid.sx;
        const dy = arrowEnd.sy - arrowMid.sy;
        const len = Math.sqrt(dx*dx + dy*dy);
        if (len > 0) {
          const nx = dx / len;
          const ny = dy / len;
          const perpX = -ny * 5;
          const perpY = nx * 5;
          ctx.beginPath();
          ctx.moveTo(arrowEnd.sx, arrowEnd.sy);
          ctx.lineTo(arrowMid.sx + perpX, arrowMid.sy + perpY);
          ctx.lineTo(arrowMid.sx - perpX, arrowMid.sy - perpY);
          ctx.closePath();
          ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
          ctx.fill();
        }

        // Draw listener symbol at center (small person standing upright)
        // 足元が原点(z=0)に接し、上に立ち上がる
        const feetPos = this._project(0, 0, 0);       // feet at ground (center)
        const hipPos = this._project(0, 0, 0.08);     // hip
        const shoulderPos = this._project(0, 0, 0.18); // shoulders/neck
        const headPos = this._project(0, 0, 0.24);    // head
        const headRadius = radius * 0.04;

        // Body line (hip to shoulders only — not through legs)
        ctx.beginPath();
        ctx.moveTo(hipPos.sx, hipPos.sy);
        ctx.lineTo(shoulderPos.sx, shoulderPos.sy);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Head (small circle)
        ctx.beginPath();
        ctx.arc(headPos.sx, headPos.sy, headRadius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.fill();

        // Neck (shoulders to head)
        ctx.beginPath();
        ctx.moveTo(shoulderPos.sx, shoulderPos.sy);
        ctx.lineTo(headPos.sx, headPos.sy);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Arms (from shoulders, short horizontal)
        const armL = this._project(0, 0.06, 0.16);
        const armR = this._project(0, -0.06, 0.16);
        ctx.beginPath();
        ctx.moveTo(armL.sx, armL.sy);
        ctx.lineTo(armR.sx, armR.sy);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Legs (from hip to feet, spread to match arm width)
        const legL = this._project(0, 0.04, 0);
        const legR = this._project(0, -0.04, 0);
        ctx.beginPath();
        ctx.moveTo(hipPos.sx, hipPos.sy);
        ctx.lineTo(legL.sx, legL.sy);
        ctx.moveTo(hipPos.sx, hipPos.sy);
        ctx.lineTo(legR.sx, legR.sy);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Cache the fixed background
        this._bgImageData = ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
      },

      // Restore cached background (called before drawing rotating elements in task 14.2)
      restoreBackground() {
        if (this._bgImageData) {
          this.ctx.putImageData(this._bgImageData, 0, 0);
        }
      },

      // Get canvas size info for external use
      getMetrics() {
        const canvasSize = this.canvas.width / (window.devicePixelRatio || 1);
        return {
          centerX: canvasSize / 2,
          centerY: canvasSize / 2,
          radius: canvasSize * 0.4,
          canvasSize,
        };
      },

      // Task 14.2: 3 軸大円の回転追従描画
      // 要件 5.1, 5.2, 5.3, 5.4, 5.5, 5.6, 5.7, 19.5
      drawAxes(rotationState) {
        // Restore fixed background (sphere, outline, arrow)
        this.restoreBackground();
        if (!this._bgImageData) {
          this.drawFixed();
          this.restoreBackground();
        }

        const ctx = this.ctx;
        const { yaw, pitch, roll } = rotationState;

        // Build the 3x3 rotation matrix from current state (Yaw only, Pitch=Roll=0)
        // 視覚的な回転方向: 球体の手前側（カメラ側）を触って回す感覚にするため
        // Yaw を反転して描画する（音源への回転値はそのまま）
        const R = window.AmbiMath.buildR3(-yaw, 0, 0);

        // Number of discrete points per great circle (64–128 per design)
        const NUM_POINTS = 96;

        // Axis configurations: X=red, Y=green, Z=blue
        const axisConfigs = [
          { color: '#ff4444', label: 'X' }, // X-axis: circle in YZ plane
          { color: '#44dd66', label: 'Y' }, // Y-axis: circle in XZ plane
          { color: '#4488ff', label: 'Z' }, // Z-axis: circle in XY plane
        ];

        for (let axisIdx = 0; axisIdx < 3; axisIdx++) {
          const { color, label } = axisConfigs[axisIdx];

          // Generate points on the great circle, apply rotation R, then project
          const points = [];
          for (let i = 0; i < NUM_POINTS; i++) {
            const angle = (i / NUM_POINTS) * Math.PI * 2;
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);

            // Generate point on unit circle in the appropriate plane
            let px, py, pz;
            if (axisIdx === 0) { // X-axis: circle in YZ plane
              px = 0; py = cos; pz = sin;
            } else if (axisIdx === 1) { // Y-axis: circle in XZ plane
              px = cos; py = 0; pz = sin;
            } else { // Z-axis: circle in XY plane
              px = cos; py = sin; pz = 0;
            }

            // Apply rotation R to the point
            const rx = R[0]*px + R[1]*py + R[2]*pz;
            const ry = R[3]*px + R[4]*py + R[5]*pz;
            const rz = R[6]*px + R[7]*py + R[8]*pz;

            // Project to 2D using camera
            points.push(this._project(rx, ry, rz));
          }

          // Draw segments with front/back alpha differentiation
          for (let i = 0; i < NUM_POINTS; i++) {
            const p0 = points[i];
            const p1 = points[(i + 1) % NUM_POINTS];
            // Midpoint depth determines front/back
            const midDepth = (p0.depth + p1.depth) / 2;
            const isFront = midDepth > 0;

            ctx.beginPath();
            ctx.moveTo(p0.sx, p0.sy);
            ctx.lineTo(p1.sx, p1.sy);
            ctx.strokeStyle = color;
            ctx.globalAlpha = isFront ? 0.9 : 0.25;
            ctx.lineWidth = isFront ? 2 : 1.5;
            ctx.stroke();
          }
          ctx.globalAlpha = 1.0;

          // Draw axis label near a visible front point of the circle
          let labelPoint = null;
          for (const p of points) {
            if (p.depth > 0) {
              if (!labelPoint || p.sy < labelPoint.sy) {
                labelPoint = p;
              }
            }
          }
          // Fallback: use the point with highest screen Y if no front point
          if (!labelPoint) {
            labelPoint = points[0];
            for (const p of points) {
              if (p.sy < labelPoint.sy) labelPoint = p;
            }
          }
          ctx.font = '10px sans-serif';
          ctx.fillStyle = color;
          ctx.globalAlpha = 0.7;
          ctx.fillText(label, labelPoint.sx + 4, labelPoint.sy - 4);
          ctx.globalAlpha = 1.0;
        }

        // Draw intersection markers at the 6 axis intersection points
        // Each pair of axes intersects at 2 points on the unit sphere (positive and negative)
        // Positive intersections: white filled circle
        // Negative intersections: black filled circle with white outline
        const intersections = [
          // X∩Y (Z-axis direction): +z and -z
          { point: [0, 0, 1], positive: true },
          { point: [0, 0, -1], positive: false },
          // X∩Z (Y-axis direction): +y and -y
          { point: [0, 1, 0], positive: true },
          { point: [0, -1, 0], positive: false },
          // Y∩Z (X-axis direction): +x and -x
          { point: [1, 0, 0], positive: true },
          { point: [-1, 0, 0], positive: false },
        ];

        const markerRadius = 4;
        for (const { point, positive } of intersections) {
          const [px, py, pz] = point;
          // Apply rotation
          const rx = R[0]*px + R[1]*py + R[2]*pz;
          const ry = R[3]*px + R[4]*py + R[5]*pz;
          const rz = R[6]*px + R[7]*py + R[8]*pz;
          const proj = this._project(rx, ry, rz);

          // Only draw if on the front side (visible)
          const alpha = proj.depth > 0 ? 0.9 : 0.3;

          ctx.beginPath();
          ctx.arc(proj.sx, proj.sy, markerRadius, 0, Math.PI * 2);
          if (positive) {
            // White filled circle
            ctx.fillStyle = 'rgba(255, 255, 255, ' + alpha + ')';
            ctx.fill();
          } else {
            // Black filled circle with white outline
            ctx.fillStyle = 'rgba(0, 0, 0, ' + alpha + ')';
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, ' + alpha + ')';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }
        }
      },
    };

    // ============================================================
    // ExportManager（Task 16.1）
    // OfflineAudioContext による回転適用済みレンダリングと WAV エンコード。
    // 要件 14.1, 15.1
    // ============================================================
    const ExportManager = {
      /**
       * OfflineAudioContext を用いてオフラインレンダリングを行う。
       * リアルタイムと同一の AudioWorklet プロセッサを使用する。
       *
       * @param {AudioBuffer} audioBuffer - 元音源の AudioBuffer
       * @param {object} opts - { order, channelCount, rotationState, decodeMode, hrtfPayload, outputChannels }
       * @returns {Promise<AudioBuffer>} レンダリング結果
       */
      async _renderOffline(audioBuffer, opts) {
        const { order, channelCount, rotationState, decodeMode, hrtfPayload, outputChannels = 2 } = opts;
        const sampleRate = audioBuffer.sampleRate;
        const length = audioBuffer.length;

        // Create OfflineAudioContext
        const offlineCtx = new OfflineAudioContext(outputChannels, length, sampleRate);

        // Register the same worklet module
        await offlineCtx.audioWorklet.addModule(PROCESSOR_BLOB_URL);

        // Create source
        const source = offlineCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.channelCount = channelCount;
        source.channelCountMode = 'explicit';
        source.channelInterpretation = 'discrete';

        // Create decoder worklet node
        const decoderNode = new AudioWorkletNode(offlineCtx, 'ambisonics-decoder-processor', {
          numberOfInputs: 1,
          numberOfOutputs: 1,
          outputChannelCount: [outputChannels],
          channelCount: channelCount,
          channelCountMode: 'explicit',
          channelInterpretation: 'discrete',
          processorOptions: {
            order: order,
            channelCount: channelCount,
            outputChannels: outputChannels,
            stereoMatrix: Array.from(window.AmbiMath.buildStereoDecodeMatrix(order)),
          },
        });

        // Set decode mode
        decoderNode.port.postMessage({ type: 'mode', mode: decodeMode || 'stereo' });

        // Set rotation
        const isIdentity = window.AmbiMath.isIdentityRotation(
          rotationState.yaw, rotationState.pitch, rotationState.roll
        );
        if (!isIdentity) {
          const matrix = window.AmbiMath.buildRotationMatrix(order, rotationState.yaw, rotationState.pitch, rotationState.roll);
          decoderNode.port.postMessage({ type: 'rotation', matrix: matrix, isIdentity: false });
        }

        // Set HRTF if binaural
        if (decodeMode === 'binaural' && hrtfPayload) {
          decoderNode.port.postMessage({
            type: 'hrir',
            left: hrtfPayload.left,
            right: hrtfPayload.right,
            firLength: hrtfPayload.firLength,
          });
        }

        // Connect: source → decoder → destination
        source.connect(decoderNode);
        decoderNode.connect(offlineCtx.destination);

        // Start and render
        source.start(0);
        const renderedBuffer = await offlineCtx.startRendering();
        return renderedBuffer;
      },

      /**
       * ステレオ書き出し（Task 16.2）
       * 書き出し時点の回転・デコードモードを適用した 2ch WAV Blob を生成する。
       * 要件 14.1, 14.2, 14.3, 14.4, 14.5, 14.6
       *
       * @param {AudioBuffer} audioBuffer - 元音源の AudioBuffer
       * @param {{ yaw: number, pitch: number, roll: number }} rotationState - 回転状態
       * @param {string} decodeMode - 'stereo' | 'binaural'
       * @param {object|null} hrtfPayload - バイノーラル用 HRTF ペイロード（stereo 時は null 可）
       * @returns {Promise<Blob>} 2ch WAV Blob
       */
      async exportStereo(audioBuffer, rotationState, decodeMode, hrtfPayload) {
        // Validation
        if (!audioBuffer) {
          throw createLoadError(AudioErrorType.EXPORT_NO_SOURCE);
        }

        const formatInfo = window.AmbiMath.detectFormat(audioBuffer.numberOfChannels);
        if (!formatInfo) {
          throw createLoadError(AudioErrorType.EXPORT_ERROR, { detail: '無効な音源です。' });
        }

        try {
          // Render offline with current rotation and decode mode (stereo or binaural)
          const renderedBuffer = await this._renderOffline(audioBuffer, {
            order: formatInfo.order,
            channelCount: formatInfo.channelCount,
            rotationState: rotationState,
            decodeMode: decodeMode || 'stereo',
            hrtfPayload: hrtfPayload,
            outputChannels: 2,
          });

          // Extract channels from rendered AudioBuffer
          const channels = [];
          for (let ch = 0; ch < renderedBuffer.numberOfChannels; ch++) {
            channels.push(renderedBuffer.getChannelData(ch));
          }

          // Encode to WAV
          const wavBuffer = window.AmbiMath.encodeWavPCM(channels, renderedBuffer.sampleRate, 16);

          // Create Blob
          const blob = new Blob([wavBuffer], { type: 'audio/wav' });
          return blob;
        } catch (err) {
          if (err instanceof AudioLoadError) throw err;
          throw createLoadError(AudioErrorType.EXPORT_ERROR, { cause: err });
        }
      },

      /**
       * Ambisonics 書き出し（Task 16.3）
       * デコード行列を恒等にして回転のみ適用した N ch を WAV にエンコードする。
       * outFormat='fuma' 時は ambixToFuma で変換してから出力する。
       * 要件 15.1, 15.2, 15.3, 15.4, 15.5, 15.6, 15.7, 16.2, 16.4
       *
       * @param {AudioBuffer} audioBuffer - 元音源の AudioBuffer
       * @param {{ yaw: number, pitch: number, roll: number }} rotationState - 回転状態
       * @param {{ order: number, channelCount: number, format: string }|null} formatInfo - フォーマット情報
       * @param {string} outFormat - 'ambix' | 'fuma'
       * @returns {Promise<Blob>} N ch WAV Blob
       */
      async exportAmbisonics(audioBuffer, rotationState, formatInfo, outFormat = 'ambix') {
        // Validation
        if (!audioBuffer) {
          throw createLoadError(AudioErrorType.EXPORT_NO_SOURCE);
        }
        if (!formatInfo || !window.AmbiMath.isValidAmbisonicsChannelCount(formatInfo.channelCount)) {
          throw createLoadError(AudioErrorType.EXPORT_INVALID_AMBISONICS);
        }

        try {
          const order = formatInfo.order;
          const N = formatInfo.channelCount;

          // Extract channels from AudioBuffer
          const channels = [];
          for (let ch = 0; ch < N; ch++) {
            channels.push(new Float32Array(audioBuffer.getChannelData(ch)));
          }

          // Apply rotation (pure function, no AudioWorklet needed for Ambisonics export)
          let rotatedChannels;
          const isIdentity = window.AmbiMath.isIdentityRotation(
            rotationState.yaw, rotationState.pitch, rotationState.roll
          );
          if (isIdentity) {
            rotatedChannels = channels;
          } else {
            const matrix = window.AmbiMath.buildRotationMatrix(order, rotationState.yaw, rotationState.pitch, rotationState.roll);
            rotatedChannels = window.AmbiMath.applyRotationToBuffer(channels, matrix, order);
          }

          // Convert to FuMa if requested
          let outputChannels = rotatedChannels;
          if (outFormat === 'fuma') {
