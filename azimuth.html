      UI.setLoading(true);

      try {
        const info = await audioEngine.loadTrack(objectUrl);
        info.name = file.name;  // ObjectURLではなくファイル名を使用
        trackState.info = info;
        trackState.loadingState = 'loaded';
        UI.setLoading(false);
        UI.updateTrackInfo(info);

        // Show format info (Task 18.1)
        const formatInfoEl = document.getElementById('format-info');
        const formatInfoText = document.getElementById('format-info-text');
        if (info.format) {
          formatInfoText.textContent = window.AmbiMath.formatInfoToDisplay(info.format);
          formatInfoEl.hidden = false;
        } else {
          formatInfoEl.hidden = true;
        }

        const canvas = UI.els.waveformA;
        UI._resizeCanvas(canvas);
        const buffer = audioEngine.track.buffer;
        if (buffer) { waveformRenderer.draw(canvas, buffer); }

        const loaded = isPlayEnabled(AppState.track.loadingState === 'loaded');
        UI.setTransportEnabled(loaded);

        if (AppState.playback.isPlaying) {
          audioEngine.stop();
          AppState.playback.isPlaying = false;
          UI.updatePlayState(false);
          stopAnimationLoop();
        }
        AppState.playback.currentTime = 0;
        audioEngine._playbackState.offset = 0;

        if (loaded) {
          const duration = audioEngine.getDuration();
          AppState.playback.duration = duration;
          UI.updateProgress(0, duration);
        }

        // Update source status
        updateSourceStatus();
        updateMediaElementWarning();

        // Apply current decode mode to newly created decoder (default: binaural)
        if (loaded && AppState.decodeMode === 'binaural') {
          await handleDecodeMode('binaural', true);
        }
      } catch (err) {
        trackState.loadingState = 'error';
        trackState.error = err.userMessage || err.message;
        UI.setLoading(false);
        UI.showError(trackState.error);
        updateSourceStatus();
        updateMediaElementWarning();
      }
    }

    // Task 19.1: ファイル読み込み UI と URL 変換・エラー結線 — 検証完了。
    // handleLoadTrack: URLConverter.convert (Dropbox変換), Google Drive検出, ローディング表示,
    //   formatTime による再生時間表示, 失敗時の状態保持がすべて結線済み。
    // handleLoadFile: URL.createObjectURL によるローカル読み込み, 同一の loadTrack パス使用。
    // ドラッグ&ドロップ: e.dataTransfer.files[0] で先頭1ファイルのみ採用。
    // エラーメッセージ: すべて日本語。updateSourceStatus で状態表示を更新。

    async function handleLoadTrack() {
      // Ensure AudioContext is initialized on user interaction
      try {
        await audioEngine.initialize();
      } catch (err) {
        UI.showError(err.userMessage || err.message);
        return;
      }

      const rawUrl = UI.els.urlA.value.trim();
      if (!rawUrl) return;

      // Google Drive URLの検出 — 非対応であることを通知
      if (/^https?:\/\/drive\.google\.com\//i.test(rawUrl)) {
        UI.showError('Google Driveの共有リンクには対応していません。Dropboxや、CORSに対応したサーバー上の直接リンクをご利用ください。');
        return;
      }

      const trackState = AppState.track;

      // Clear previous error
      UI.showError(null);

      // Convert URL
      const { converted, isConverted, originalUrl } = URLConverter.convert(rawUrl);
      trackState.url = rawUrl;
      trackState.convertedUrl = isConverted ? converted : null;

      // Set loading state
      trackState.loadingState = 'loading';
      UI.setLoading(true);

      try {
        const info = await audioEngine.loadTrack(converted, isConverted ? originalUrl : undefined);
        trackState.info = info;
        trackState.loadingState = 'loaded';
        UI.setLoading(false);
        UI.updateTrackInfo(info);

        // Show format info (Task 18.1)
        const formatInfoEl = document.getElementById('format-info');
        const formatInfoText = document.getElementById('format-info-text');
        if (info.format) {
          formatInfoText.textContent = window.AmbiMath.formatInfoToDisplay(info.format);
          formatInfoEl.hidden = false;
        } else {
          formatInfoEl.hidden = true;
        }

        // Draw waveform
        const canvas = UI.els.waveformA;
        UI._resizeCanvas(canvas);
        const buffer = audioEngine.track.buffer;
        if (buffer) {
          waveformRenderer.draw(canvas, buffer);
        }

        // Update transport enabled state
        const loaded = isPlayEnabled(AppState.track.loadingState === 'loaded');
        UI.setTransportEnabled(loaded);

        // Reset playback position to start when a new track is loaded
        if (AppState.playback.isPlaying) {
          audioEngine.stop();
          AppState.playback.isPlaying = false;
          UI.updatePlayState(false);
          stopAnimationLoop();
        }
        AppState.playback.currentTime = 0;
        audioEngine._playbackState.offset = 0;

        // Update progress bar max to audio duration when loaded
        if (loaded) {
          const duration = audioEngine.getDuration();
          AppState.playback.duration = duration;
          UI.updateProgress(0, duration);
        }

        // Update browser URL (new schema — task 6.1 / task 19.2)
        ShareManager.updateUrl({
          src: AppState.track.loadingState === 'loaded' ? AppState.track.url : null,
          yaw: RotationController.state.yaw,
          mode: AppState.decodeMode,
          vol: Math.round(AppState.volume * 100),
          t: AppState.playback.currentTime,
          loop: AppState.isLooping,
        });

        // Update source status
        updateSourceStatus();
        updateMediaElementWarning();

        // Apply current decode mode to newly created decoder (default: binaural)
        if (loaded && AppState.decodeMode === 'binaural') {
          await handleDecodeMode('binaural', true);
        }
      } catch (err) {
        trackState.loadingState = 'error';
        trackState.error = err.userMessage || err.message;
        UI.setLoading(false);
        UI.showError(trackState.error);
        updateSourceStatus();
        updateMediaElementWarning();
      }
    }

    function updateSourceStatus() {
      const trackState = AppState.track;
      const statusText = document.querySelector('#source-status-a .source-status-text');
      const clearBtn = document.getElementById('clear-a');

      if (trackState.loadingState !== 'loaded' || !trackState.info) {
        statusText.textContent = '音源が読み込まれていません';
        statusText.className = 'source-status-text';
        clearBtn.hidden = true;
        return;
      }

      if (trackState.url) {
        // Network file
        statusText.textContent = '🌐 ' + trackState.url;
        statusText.className = 'source-status-text loaded-network';
      } else {
        // Local file
        statusText.textContent = '📁 ' + trackState.info.name;
        statusText.className = 'source-status-text loaded-local';
      }
      clearBtn.hidden = false;
    }

    function updateMediaElementWarning() {
      const t = audioEngine.track;
      const warningEl = document.getElementById('warning-a');
      const canvas = UI.els.waveformA;
      const isMediaElement = t.useMediaElement;

      // Task 18.2: In MediaElement mode, disable waveform, decode mode selector,
      // rotation canvas, and export buttons (if they exist)
      const modeStereo = document.getElementById('mode-stereo');
      const modeBinaural = document.getElementById('mode-binaural');
      const rotationCanvas = document.getElementById('rotation-canvas');

      if (isMediaElement) {
        warningEl.hidden = false;
        canvas.classList.add('disabled');
        // Disable decode mode buttons
        if (modeStereo) modeStereo.disabled = true;
        if (modeBinaural) modeBinaural.disabled = true;
        // Disable rotation canvas interaction
        if (rotationCanvas) rotationCanvas.style.pointerEvents = 'none';
      } else {
        warningEl.hidden = true;
        canvas.classList.remove('disabled');
        // Re-enable decode mode buttons
        if (modeStereo) modeStereo.disabled = false;
        if (modeBinaural) modeBinaural.disabled = false;
        // Re-enable rotation canvas interaction
        if (rotationCanvas) rotationCanvas.style.pointerEvents = '';
      }
    }

    function handleClearTrack() {
      const trackState = AppState.track;

      // Stop playback if playing
      if (AppState.playback.isPlaying) {
        AppState.playback.isPlaying = false;
        UI.updatePlayState(false);
        stopAnimationLoop();
      }

      // Atomic clear of audio engine track (stop + reset position 0 + release buffer/element)
      audioEngine.clearTrack();

      // Clear track state
      trackState.url = '';
      trackState.convertedUrl = null;
      trackState.info = null;
      trackState.loadingState = 'idle';
      trackState.error = null;

      // Clear UI
      UI.els.urlA.value = '';
      UI.updateTrackInfo(null);
      UI.showError(null);
      UI.setTransportEnabled(false);

      // Hide format info (Task 18.1)
      document.getElementById('format-info').hidden = true;

      // Clear waveform
      const canvas = UI.els.waveformA;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#1a1a35';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Reset playback position
      AppState.playback.currentTime = 0;
      UI.updateProgress(0, 0);

      // Update source status
      updateSourceStatus();
      updateMediaElementWarning();
    }

    function handleTogglePlay() {
      if (!isPlayEnabled(AppState.track.loadingState === 'loaded')) return;

      if (AppState.playback.isPlaying) {
        // Stop
        const currentTime = audioEngine.stop();
        AppState.playback.isPlaying = false;
        AppState.playback.currentTime = currentTime;
        UI.updatePlayState(false);
        stopAnimationLoop();
      } else {
        // Play
        audioEngine.play(AppState.playback.currentTime);
        AppState.playback.isPlaying = true;
        UI.updatePlayState(true);
        startAnimationLoop();
      }
    }

    function handleVolumeChange(value) {
      const v = parseFloat(value);
      AppState.volume = v;
      audioEngine.setVolume(v);
    }

    function handleProgressSeek(value) {
      const duration = audioEngine.getDuration();
      // [0, duration] にクランプ（要件 10.6/10.7）。
      const position = window.AmbiMath.clampSeek(parseFloat(value), duration);
      AppState.playback.currentTime = position;
      audioEngine.seek(position);
      UI.updateProgress(position, duration);

      // Update waveform playhead
      if (duration > 0) {
        const progress = position / duration;
        waveformRenderer.updatePlayhead(UI.els.waveformA, progress);
      }
    }

    function handleLoopToggle() {
      AppState.isLooping = !AppState.isLooping;
      audioEngine.setLooping(AppState.isLooping);
      UI.updateLoopState(AppState.isLooping);
    }

    async function handleShare() {
      // Task 19.2: 全パラメータ（回転・デコードモード含む）を state オブジェクトとして渡す
      // 再生位置は AudioEngine から直接取得（再生中でも停止中でも正確）
      const currentTime = audioEngine.getCurrentTime();
      const state = {
        src: AppState.track.loadingState === 'loaded' ? AppState.track.url : null,
        yaw: RotationController.state.yaw,
        mode: AppState.decodeMode,
        vol: Math.round(AppState.volume * 100),
        t: currentTime,
        loop: AppState.isLooping,
      };
      const shareUrl = ShareManager.generateShareUrl(state);
      const success = await ShareManager.copyToClipboard(shareUrl);
      const shareBtn = UI.els.shareBtn;
      const originalText = shareBtn.textContent;
      if (success) {
        shareBtn.textContent = '✅ コピーしました!';
        setTimeout(() => { shareBtn.textContent = originalText; }, 2000);
      } else {
        // 要件 13.9/13.10: コピー失敗時は URL を手動コピー用に表示する
        shareBtn.textContent = '❌ コピーに失敗しました';
        // 一時的に URL を表示する要素を作成
        let urlDisplay = document.getElementById('share-url-display');
        if (!urlDisplay) {
          urlDisplay = document.createElement('input');
          urlDisplay.id = 'share-url-display';
          urlDisplay.type = 'text';
          urlDisplay.readOnly = true;
          urlDisplay.style.cssText = 'width:100%;margin-top:8px;padding:6px 10px;background:var(--color-bg-input);border:1px solid var(--color-border);border-radius:4px;color:var(--color-text);font-size:0.75rem;';
          urlDisplay.setAttribute('aria-label', '共有URL（手動コピー用）');
          shareBtn.parentElement.appendChild(urlDisplay);
        }
        urlDisplay.value = shareUrl;
        urlDisplay.hidden = false;
        urlDisplay.select();
        setTimeout(() => {
          shareBtn.textContent = originalText;
          urlDisplay.hidden = true;
        }, 8000);
      }
    }

    function handleWaveformClick(event) {
      // MediaElement モードでは波形クリックシークを無効化
      const t = audioEngine.track;
      if (t.useMediaElement) return;

      const canvas = UI.els.waveformA;
      const position = waveformRenderer.getPositionFromClick(canvas, event.clientX);
      const duration = audioEngine.getDuration();
      if (duration > 0) {
        const seekTime = position * duration;
        handleProgressSeek(seekTime);
      }
    }

    // ============================================================
    // Animation Loop (Task 13.3)
    // ============================================================

    function startAnimationLoop() {
      if (animationFrameId) return;
      function tick() {
        if (!AppState.playback.isPlaying) {
          animationFrameId = null;
          return;
        }

        const currentTime = audioEngine.getCurrentTime();
        const duration = audioEngine.getDuration();

        // End-of-track detection
        if (duration > 0 && currentTime >= duration) {
          if (AppState.isLooping) {
            // Loop: restart from beginning
            audioEngine.stop();
            AppState.playback.currentTime = 0;
            audioEngine.play(0);
            AppState.playback.isPlaying = true;
          } else {
            // Stop: reset to beginning
            audioEngine.stop();
            AppState.playback.isPlaying = false;
            AppState.playback.currentTime = 0;
            UI.updatePlayState(false);
            UI.updateProgress(0, duration);
            waveformRenderer.updatePlayhead(UI.els.waveformA, 0);
            animationFrameId = null;
            return;
          }
        }

        // Update progress bar and time display
        const displayTime = Math.min(currentTime, duration);
        AppState.playback.currentTime = displayTime;
        UI.updateProgress(displayTime, duration);

        // Update waveform playhead
        if (duration > 0) {
          const progress = displayTime / duration;
          waveformRenderer.updatePlayhead(UI.els.waveformA, progress);
        }

        animationFrameId = requestAnimationFrame(tick);
      }
      animationFrameId = requestAnimationFrame(tick);
    }

    function stopAnimationLoop() {
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
    }

    // ============================================================
    // Decode Mode & HRTF Loading (Task 15.4)
    // ============================================================

    async function handleDecodeMode(mode, force = false) {
      if (!force && mode === AppState.decodeMode) return;

      if (mode === 'binaural') {
        // Try to load HRTF if not already loaded
        if (!AppState._hrtfPayload) {
          const success = await loadHRTF();
          if (!success) {
            // Show HRTF select button, fall back to stereo for now
            // Don't disable binaural button — user can still load HRTF via the button
            AppState.decodeMode = 'stereo';
            if (audioEngine.decoder) {
              audioEngine.decoder.setDecodeMode('stereo');
            }
            // Update UI to show stereo as active
            document.getElementById('mode-stereo').classList.add('mode-btn-active');
            document.getElementById('mode-stereo').setAttribute('aria-checked', 'true');
            document.getElementById('mode-binaural').classList.remove('mode-btn-active');
            document.getElementById('mode-binaural').setAttribute('aria-checked', 'false');
            return;
          }
        }
        // Send HRTF to decoder
        if (audioEngine.decoder && AppState._hrtfPayload) {
          audioEngine.decoder.setBinauralHRTF(AppState._hrtfPayload);
        }
      }

      AppState.decodeMode = mode;

      // Update decoder mode
      if (audioEngine.decoder) {
        audioEngine.decoder.setDecodeMode(mode);
      }

      // Update UI
      document.getElementById('mode-stereo').classList.toggle('mode-btn-active', mode === 'stereo');
      document.getElementById('mode-stereo').setAttribute('aria-checked', mode === 'stereo' ? 'true' : 'false');
      document.getElementById('mode-binaural').classList.toggle('mode-btn-active', mode === 'binaural');
      document.getElementById('mode-binaural').setAttribute('aria-checked', mode === 'binaural' ? 'true' : 'false');
    }

    async function loadHRTF() {
      const order = audioEngine.decoder ? audioEngine.decoder.order : 3;

      // Step 1: Try to fetch the fixed external file hrir_sh.json
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000); // 15s timeout
        const response = await fetch('hrir_sh.json', { signal: controller.signal });
        clearTimeout(timeoutId);

        if (response.ok) {
          const data = await response.json();
          if (window.AmbiMath.validateHRTF(data, order)) {
            AppState._hrtfPayload = window.AmbiMath.toWorkletPayload(data, order);
            AppState.binauralAvailable = true;
            return true;
          }
        }
      } catch (err) {
        // Fetch failed or timed out — fall through to local file dialog
      }

      // Step 2: Open file selection dialog directly
      try {
        const file = await promptLocalHRTFFile();
        if (!file) return false; // User cancelled

        const text = await file.text();
        const data = JSON.parse(text);
        if (window.AmbiMath.validateHRTF(data, order)) {
          AppState._hrtfPayload = window.AmbiMath.toWorkletPayload(data, order);
          AppState.binauralAvailable = true;
          return true;
        }
      } catch (err) {
        // Local file failed
      }

      // Both failed
      AppState.binauralAvailable = false;
      return false;
    }

    function promptLocalHRTFFile() {
      return new Promise((resolve) => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.style.display = 'none';
        document.body.appendChild(input);
        input.addEventListener('change', () => {
          resolve(input.files[0] || null);
          document.body.removeChild(input);
        });
        // Handle cancel (no file selected)
        // Use a focus-back heuristic since 'cancel' event is not universally supported
        input.addEventListener('cancel', () => {
          resolve(null);
          document.body.removeChild(input);
        });
        input.click();
      });
    }

    // ============================================================
    // Application Initialization (Task 14.1 & 14.2)
    // ============================================================

    function initApp() {
      // Initialize UI module
      UI.initialize();

      // 初期（未読込）状態: 再生・停止・先頭復帰・ループ・シークを無効化する（要件 10.8）。
      //   マークアップは最小に保ち、無効化は JS 初期化で一括設定する。
      UI.setTransportEnabled(false);
      // 未読込状態 UI: フォーマット情報は非表示のまま、ソースステータスに
      //   「音源が読み込まれていません」を表示する（要件 2.5, 4.3）。
      updateSourceStatus();

      // --- Set README link URL ---
      // Auto-detect GitHub repo URL from github.io hosting, otherwise use a placeholder
      const readmeLink = document.getElementById('readme-link');
      if (readmeLink) {
        const host = window.location.hostname;
        if (host.endsWith('.github.io')) {
          const user = host.replace('.github.io', '');
          const repo = window.location.pathname.split('/')[1] || '';
          readmeLink.href = 'https://github.com/' + user + '/' + repo + '#readme';
        }
      }

      // --- Event Listeners (single-track, task 10.2) ---

      // Load button
      UI.els.loadA.addEventListener('click', () => handleLoadTrack());

      // File button
      const fileInputA = document.getElementById('file-input-a');
      document.getElementById('file-a').addEventListener('click', () => fileInputA.click());
      fileInputA.addEventListener('change', (e) => {
        if (e.target.files[0]) handleLoadFile(e.target.files[0]);
        e.target.value = '';  // 同じファイルを再選択可能にする
      });

      // Clear button
      document.getElementById('clear-a').addEventListener('click', () => handleClearTrack());

      // Drag & drop on track panel (先頭 1 ファイルのみ採用)
      const trackPanel = document.getElementById('track-a');
      if (trackPanel) {
        trackPanel.addEventListener('dragover', (e) => {
          e.preventDefault();
          trackPanel.classList.add('drop-active');
        });
        trackPanel.addEventListener('dragleave', (e) => {
          // Only remove if leaving the panel (not entering a child)
          if (!trackPanel.contains(e.relatedTarget)) {
            trackPanel.classList.remove('drop-active');
          }
        });
        trackPanel.addEventListener('drop', (e) => {
          e.preventDefault();
          trackPanel.classList.remove('drop-active');
          const file = e.dataTransfer.files[0];
          if (file) handleLoadFile(file);
        });
      }

      // Allow Enter key in URL input to trigger load
      UI.els.urlA.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleLoadTrack();
      });

      // Play/Stop button
      UI.els.playBtn.addEventListener('click', handleTogglePlay);

      // Seek to start button
      UI.els.seekStartBtn.addEventListener('click', () => {
        handleProgressSeek(0);
      });

      // Loop button
      UI.els.loopBtn.addEventListener('click', handleLoopToggle);

      // Volume slider
      UI.els.volumeA.addEventListener('input', (e) => {
        handleVolumeChange(e.target.value);
      });

      // Progress bar
      UI.els.progressBar.addEventListener('input', (e) => {
        handleProgressSeek(e.target.value);
      });

      // Share button
      UI.els.shareBtn.addEventListener('click', handleShare);

      // Waveform click
      UI.els.waveformA.addEventListener('click', (e) => handleWaveformClick(e));

      // Keyboard shortcuts help toggle
      UI.els.shortcutsToggle.addEventListener('click', () => {
        const list = UI.els.shortcutsList;
        const isHidden = list.hidden;
        list.hidden = !isHidden;
        UI.els.shortcutsToggle.setAttribute('aria-expanded', isHidden ? 'true' : 'false');
      });

      // --- Register Keyboard Handler (task 10.5: Space → toggle play, 登録キーのみ preventDefault) ---
      KeyboardHandler.register({
        onTogglePlay: handleTogglePlay,
      });

      // --- Task 14.1: 回転 UI ビジュアル（Canvas 2D 球体ギズモ）初期化 ---
      RotationGizmo.init('rotation-canvas');
      // Task 14.2: Initial draw of axes at identity rotation
      RotationGizmo.drawAxes({ yaw: 0, pitch: 0, roll: 0 });

      // Task 14.2: Wire pointer/touch events on the rotation canvas
      const rotCanvas = document.getElementById('rotation-canvas');
      rotCanvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        rotCanvas.setPointerCapture(e.pointerId);
        RotationController.beginGesture(e.clientX, e.clientY);
      });
      rotCanvas.addEventListener('pointermove', (e) => {
        if (!e.buttons) return; // not dragging
        e.preventDefault();
        RotationController.updateGesture(e.clientX, e.clientY);
      });
      rotCanvas.addEventListener('pointerup', (e) => {
        rotCanvas.releasePointerCapture(e.pointerId);
        RotationController.endGesture();
      });
      rotCanvas.addEventListener('pointercancel', (e) => {
        RotationController.endGesture();
      });

      // RotationController.onChange → デコーダーへの回転反映 + ギズモ再描画
      RotationController.onChange((state) => {
        // Task 14.2: Redraw gizmo axes with current rotation
        RotationGizmo.drawAxes(state);

        // Send rotation matrix to decoder (Yaw only, Pitch=Roll=0)
        if (audioEngine.decoder) {
          const order = audioEngine.decoder.order;
          const isIdentity = window.AmbiMath.isIdentityRotation(state.yaw, 0, 0);
          if (isIdentity) {
            audioEngine.decoder.setRotationMatrix(null, true);
          } else {
            const matrix = window.AmbiMath.buildRotationMatrix(order, state.yaw, 0, 0);
            audioEngine.decoder.setRotationMatrix(matrix, false);
          }
        }
      });

      // Reset button (要件 7.1, 7.2)
      document.getElementById('rotation-reset-btn').addEventListener('click', () => {
        RotationController.reset();
      });

      // --- Task 15.4: Decode mode selector event listeners ---
      document.getElementById('mode-stereo').addEventListener('click', () => handleDecodeMode('stereo'));
      document.getElementById('mode-binaural').addEventListener('click', () => handleDecodeMode('binaural'));

      // --- Handle window resize for waveform canvas ---
      window.addEventListener('resize', () => {
        UI._resizeCanvas(UI.els.waveformA);
        // Redraw waveform if buffer exists
        if (audioEngine.track.buffer) {
          waveformRenderer.draw(UI.els.waveformA, audioEngine.track.buffer);
        }
      });

      // --- URL Query Parameter Auto-Load (new schema — task 6.1 / task 19.2: full overlay結線) ---
      const params = ShareManager.getUrlParams();
      if (params.src) {
        UI.els.urlA.value = params.src;
      }
      // Auto-load track if URL param is present.
      // AudioContext requires a user gesture, so we register a one-time click handler
      // that initializes AudioContext and then loads the track.
      if (params.src) {
        const autoLoadOverlay = document.createElement('div');
        autoLoadOverlay.id = 'auto-load-overlay';
        autoLoadOverlay.style.cssText = 'position:fixed;inset:0;background:rgba(13,13,26,0.92);display:flex;align-items:center;justify-content:center;z-index:1000;cursor:pointer;padding:24px;';

        // URLからファイル名を抽出する関数
        function extractFileName(url) {
          try {
            const pathname = new URL(url).pathname;
            const segments = pathname.split('/');
            for (let i = segments.length - 1; i >= 0; i--) {
              const seg = decodeURIComponent(segments[i]);
              if (/\.(wav|mp3|flac|ogg)$/i.test(seg)) return seg;
            }
            // 拡張子が見つからない場合は最後のセグメント
            const last = decodeURIComponent(segments[segments.length - 1]);
            return last || null;
          } catch { return null; }
        }

        function formatTrackEntry(url) {
          const safeUrl = url.replace(/</g, '&lt;');
          const fileName = extractFileName(url);
          if (fileName) {
            return '<div style="margin:8px 0;">' +
              '<p style="font-size:0.95rem;color:#7c5cff;margin:0 0 2px;font-weight:600;">音源: ' + fileName.replace(/</g, '&lt;') + '</p>' +
              '<p style="font-size:0.7rem;color:#666680;margin:0;word-break:break-all;">' + safeUrl + '</p>' +
            '</div>';
          }
          return '<div style="margin:8px 0;">' +
            '<p style="font-size:0.95rem;color:#7c5cff;margin:0 0 2px;font-weight:600;">音源</p>' +
            '<p style="font-size:0.7rem;color:#666680;margin:0;word-break:break-all;">' + safeUrl + '</p>' +
          '</div>';
        }

        let urlListHtml = formatTrackEntry(params.src);

        // Task 19.2: Additional parameters display (rotation, mode, loop)
        let optionsHtml = '';
        const optionItems = [];
        if (params.yaw !== 0) {
          optionItems.push('Yaw: ' + params.yaw + '°');
        }
        if (params.mode === 'stereo') { optionItems.push('モード: ステレオ'); }
        if (params.vol !== 100) { optionItems.push('音量: ' + params.vol + '%'); }
        if (params.t > 0) { optionItems.push('開始位置: ' + window.AmbiMath.formatTime(params.t)); }
        if (params.loop) { optionItems.push('ループ: ON'); }
        if (optionItems.length > 0) {
          optionsHtml = '<p style="font-size:0.78rem;color:#8888aa;margin:8px 0 0;">' + optionItems.join(' / ') + '</p>';
        }

        autoLoadOverlay.innerHTML =
          '<div style="text-align:center;color:#e0e0f0;max-width:600px;">' +
            '<p style="font-size:1.3rem;margin-bottom:8px;">🎵 AmbisonicsPlayer</p>' +
            '<p style="font-size:0.95rem;color:#8888aa;margin-bottom:16px;">Ambisonics 再生用の音源として、ネットワーク上のファイルを読み込みます。</p>' +
            '<div style="background:rgba(26,26,53,0.8);border:1px solid #2a2a4a;border-radius:8px;padding:12px 16px;margin-bottom:20px;text-align:left;">' +
              urlListHtml + optionsHtml +
            '</div>' +
            '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">' +
              '<p id="auto-load-confirm" style="font-size:1rem;color:#e0e0f0;padding:10px 28px;display:inline-block;border:1px solid #7c5cff;border-radius:8px;background:rgba(124,92,255,0.12);cursor:pointer;">▶ クリックして読み込みを開始</p>' +
              '<p id="auto-load-cancel" style="font-size:0.9rem;color:#8888aa;padding:10px 20px;display:inline-block;border:1px solid #2a2a4a;border-radius:8px;cursor:pointer;">✕ キャンセル</p>' +
            '</div>' +
          '</div>';
        document.body.appendChild(autoLoadOverlay);

        // 要件 13.8: キャンセルで読み込まない
        const cancelBtn = autoLoadOverlay.querySelector('#auto-load-cancel');
        cancelBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          autoLoadOverlay.remove();
        });

        const startAutoLoad = async () => {
          autoLoadOverlay.remove();
          await handleLoadTrack();

          // Task 19.2: Apply rotation state from URL params after track is loaded
          if (AppState.track.loadingState === 'loaded') {
            // Apply rotation (Yaw only)
            if (params.yaw !== 0) {
              RotationController.setState(params.yaw, 0, 0);
            }

            // Apply decode mode (binaural)
            if (params.mode === 'binaural') {
              await handleDecodeMode('binaural');
            }

            // Apply loop
            if (params.loop) {
              AppState.isLooping = true;
              audioEngine.setLooping(true);
              UI.updateLoopState(true);
            }

            // Apply volume
            if (params.vol !== 100) {
              const vol = params.vol / 100;
              AppState.volume = vol;
              audioEngine.setVolume(vol);
              UI.els.volumeA.value = vol;
            }

            // 再生開始位置を適用
            if (params.t > 0) {
              AppState.playback.currentTime = params.t;
              audioEngine._playbackState.offset = params.t;
              const duration = audioEngine.getDuration();
              if (duration > 0) {
                UI.updateProgress(params.t, duration);
              }
            }

            // src 指定時は読み込み成功で常に自動再生
            handleTogglePlay();
          } else {
            // 要件 13.9: 自動読み込み失敗時は日本語メッセージ表示・自動再生しない
            // handleLoadTrack already shows the error message
          }
        };

        // Confirm button or overlay click triggers load
        const confirmBtn = autoLoadOverlay.querySelector('#auto-load-confirm');
        confirmBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          startAutoLoad();
        });
        // Also allow clicking anywhere on the overlay (except cancel) to start
        autoLoadOverlay.addEventListener('click', (e) => {
          if (e.target === cancelBtn || cancelBtn.contains(e.target)) return;
          startAutoLoad();
        }, { once: true });
      }

      // --- ?selftest=1 モード（ブラウザ内インラインテスト） ---
      // CI 非依存の単一ファイル配布向け。コンソールに AmbiMath 名前空間の内容を出力する。
      if (location.search.includes('selftest=1')) {
        console.log('[selftest] AmbiMath namespace:', Object.keys(window.AmbiMath));
        console.log('[selftest] AmbiMath object:', window.AmbiMath);
        console.log('[selftest] セルフテスト完了。純粋関数のプロパティテストは test/ ハーネスで実行してください。');
      }
    }

    // Start the application when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
